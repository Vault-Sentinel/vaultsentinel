name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-asyncio httpx respx
      
      - name: Run tests
        run: |
          pytest tests/ -v --cov=packages --cov-report=xml
      
      - name: Run MCP integration tests
        run: |
          pytest tests/integration/test_mcp_integration.py -v
      
      - name: Test MCP demo mode
        run: |
          DEMO_MODE=true python -c "
          import sys
          sys.path.insert(0, 'packages')
          from api.clients import get_mcp_client
          import asyncio
          
          async def test_demo():
              client = get_mcp_client()
              result = await client.chat({'messages': [{'role': 'user', 'content': 'test'}]})
              assert result['status'] == 'ok'
              print('Demo mode test passed')
          
          asyncio.run(test_demo())
          "
      
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.xml
          fail_ci_if_error: true

  lint:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install black isort flake8 mypy
      
      - name: Run black
        run: black --check packages/ tests/ main.py
      
      - name: Run isort
        run: isort --check-only packages/ tests/ main.py
      
      - name: Run flake8
        run: flake8 packages/ tests/ main.py
      
      - name: Run mypy
        run: mypy packages/ main.py

  build-image:
    needs: [test, lint]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Build and push Docker image
        run: |
          IMAGE=ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
          docker build -t $IMAGE -f infra/docker/Dockerfile .
          docker push $IMAGE
      
      - name: Build and push latest tag
        if: github.ref == 'refs/heads/main'
        run: |
          IMAGE_LATEST=ghcr.io/${{ github.repository }}:latest
          docker build -t $IMAGE_LATEST -f infra/docker/Dockerfile .
          docker push $IMAGE_LATEST
